[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-factor-risk-model"
version = "0.1.0"
description = "Multi-asset statistical factor risk model pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
visualization = ["matplotlib>=3.7", "plotly>=5.0"]
test = ["pytest>=7.0"]
research = ["yfinance>=0.2", "plotly>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.setuptools.packages.find]
where = ["src"]
